id: t1-001-health-invariants
logical_task_id: T1-001
tier: T1
title: Health and damage system temporal invariants
category: gameplay
status: active
engine_variants: [agnostic]
engine_scope: ENGINE_AGNOSTIC
verification_level: STATIC_INSPECTION
knowledge_domains: [game_architecture, state_machines, resource_invariants]
native_execution_required: false
prompt: >-
  Explain and formalize the core temporal invariants of an authoritative health and damage
  subsystem. Formulate mathematical postconditions for: (1) damage acceptance within and outside
  invulnerability windows, (2) resource clamping between 0 and MaxHealth, (3) exactly-once
  death state transition, and (4) event dispatch sequencing. Contrast how this invariant contract
  translates between Unreal Engine (delegates) and Unity (C# actions/events).
