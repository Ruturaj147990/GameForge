id: t1-002-pickup-contract
logical_task_id: T1-002
tier: T1
title: Reusable pickup and resource interaction contract
category: gameplay
status: active
engine_variants: [agnostic]
engine_scope: ENGINE_AGNOSTIC
verification_level: STATIC_INSPECTION
knowledge_domains: [game_architecture, component_composition, resource_invariants]
native_execution_required: false
prompt: >-
  Design a reusable contract for pickup objects and character resource interactions.
  Define: (1) overlap detection and query of player capabilities, (2) conditional consumption
  (e.g., rejecting health pickups when already at full health), (3) atomic resource modification,
  and (4) destruction or respawn lifecycle of the world pickup actor. Provide equivalent
  architectural class diagrams for both Unreal Engine UActorComponent and Unity MonoBehaviour.
