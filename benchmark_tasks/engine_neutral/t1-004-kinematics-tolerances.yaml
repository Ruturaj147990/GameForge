id: t1-004-kinematics-tolerances
logical_task_id: T1-004
tier: T1
title: Kinematics translation to measurable acceptance criteria
category: gameplay
status: active
engine_variants: [agnostic]
engine_scope: ENGINE_AGNOSTIC
verification_level: STATIC_INSPECTION
knowledge_domains: [kinematics, math_physics, benchmark_design, tolerance_modeling]
native_execution_required: false
prompt: >-
  Translate the natural-language requirement: 'The player must smoothly accelerate to top speed,
  sprint when holding shift, and stop within a short distance without sliding indefinitely'
  into explicit, measurable acceptance criteria. Define: (1) max walk/sprint speed in cm/s
  and m/s, (2) acceleration curve tolerances, (3) braking deceleration formulas, and
  (4) deterministic time-series sampling windows for automated probe evaluation.
limits: {wall_clock_seconds: 1200, max_tool_calls: 30}
