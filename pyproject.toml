[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gameforge"
version = "1.0.0"
description = "GameForge 1.0 Platform, Native IDE, Dynamic Prompt-to-Game Synthesizer, and Evaluation Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
]
ide = [
    "PySide6>=6.6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
]

[project.scripts]
gameforge = "src.gameforge_ide.launcher:main"
gameforge-ide = "src.gameforge_ide.launcher:main"
gameforge-studio = "src.gameforge_ide.launcher:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["gameforge_ide*", "src.gameforge_ide*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "E:/GameForge_Benchmarks/src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:anyio.*",
]
